# 红果短剧-去广告（安全版）
# Quantumult X Rewrite
# tag=红果短剧-去广告, update-interval=86400, opt-parser=true, enabled=true
#
# 变更说明（修复「网络错误，请点击重试」）：
# - 不再 MitM / 改包 *.fqnovel.com、reading.snssdk.com（易误伤刷视频与播放接口）
# - 仅拦截穿山甲广告下发与明确广告素材域名
# - 广告 API 使用 reject-dict，避免脚本改坏非广告响应

# 仅广告相关主机名（切勿加入 *.fqnovel.com）
hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao-b.com, is.snssdk.com, *.pglstatp-toutiao.com, sf3-fe-tos.pglstatp-toutiao.com, sf3-be-pack.pglstatp-toutiao.com, *-cdn-tos.bytescm.com, p6-ad-sign.byteimg.com, p9-ad-sign.byteimg.com, adim.pinduoduo.com

# =========================
# 1. 穿山甲 / 广告 API → 空字典拦截（不改业务包）
# =========================
^https?:\/\/[^\/]*pangolin-sdk-toutiao[^\/]*\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url reject-dict
^https?:\/\/is\.snssdk\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url reject-dict
^https?:\/\/is\.snssdk\.com\/api\/ad\/.+ url reject-dict

# =========================
# 2. 广告素材 / 渲染包（路径级，不拦业务 CDN）
# =========================
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/.+\/toutiao\.mp4 url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(obj|img)\/web\.business\.image\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/obj\/ad-site-adstyle-public\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/sf3-fe-tos\.pglstatp-toutiao\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/sf3-be-pack\.pglstatp-toutiao\.com\/obj\/ad-app-package\/.+ url reject
^https?:\/\/lf\d?-cdn-tos\.bytescm\.com\/obj\/static\/ad\/.+ url reject
^https?:\/\/p\d+-ad-sign\.byteimg\.com\/.+ url reject
^https?:\/\/[^\/]*\.byteimg\.com\/ad-app-package.+ url reject
^https?:\/\/[^\/]*\.byteimg\.com\/web\.business\.image.+ url reject
^https?:\/\/adim\.pinduoduo\.com\/.+\/toutiao\?.+ url reject

# =========================
# 3. 可选：开屏活动配置（仅 motor 运营路径，偏保守）
# =========================
^https?:\/\/[^\/]*\.snssdk\.com\/motor\/operation\/activity\/display\/config\/.+ url reject-dict
