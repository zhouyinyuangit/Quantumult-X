# 红果短剧-去广告
# Quantumult X Rewrite
# tag=红果短剧-去广告, update-interval=86400, opt-parser=true, enabled=true
#
# 说明：
# 1) 本文件只处理「可解密的广告域名」；务必同时启用 filter/HongGuo_Ads.list
# 2) 禁止 MitM *.fqnovel.com（会导致刷视频网络错误）
# 3) 滑滑流里部分广告与正片同通道，网络规则无法 100% 去净，见部署文档

# 广告相关 MitM（不要加 *.fqnovel.com）
hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao1.com, api-access.pangolin-sdk-toutiao2.com, api-access.pangolin-sdk-toutiao-b.com, is.snssdk.com, i.snssdk.com, pangolin.snssdk.com, *.pglstatp-toutiao.com, sf3-fe-tos.pglstatp-toutiao.com, sf3-be-pack.pglstatp-toutiao.com, sf3-ttcdn-tos.pstatp.com, *-cdn-tos.bytescm.com, p6-ad-sign.byteimg.com, p9-ad-sign.byteimg.com, adim.pinduoduo.com, gurd.snssdk.com

# =========================
# 1. 穿山甲：空广告包（比直接 reject 更不易触发异常页）
# =========================
^https?:\/\/[^\/]*pangolin-sdk-toutiao[^\/]*\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads_PangolinOnly.js
^https?:\/\/is\.snssdk\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads_PangolinOnly.js
^https?:\/\/i\.snssdk\.com\/api\/ad\/.+ url reject-dict
^https?:\/\/is\.snssdk\.com\/api\/ad\/.+ url reject-dict
^https?:\/\/pangolin\.snssdk\.com\/.+ url reject-dict
^https?:\/\/[^\/]*pangolin-sdk-toutiao[^\/]*\.com\/api\/ad\/.+ url reject-dict

# =========================
# 2. 广告素材 / 渲染 / 追踪资源
# =========================
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/.+\/toutiao\.mp4 url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(obj|img)\/web\.business\.image\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/obj\/ad-site-adstyle-public\/.+ url reject
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/sf3-fe-tos\.pglstatp-toutiao\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/sf3-be-pack\.pglstatp-toutiao\.com\/obj\/ad-app-package\/.+ url reject
^https?:\/\/sf3-ttcdn-tos\.pstatp\.com\/.+ url reject
^https?:\/\/lf\d?-cdn-tos\.bytescm\.com\/obj\/static\/ad\/.+ url reject
^https?:\/\/p\d+-ad-sign\.byteimg\.com\/.+ url reject
^https?:\/\/[^\/]*\.byteimg\.com\/ad-app-package.+ url reject
^https?:\/\/[^\/]*\.byteimg\.com\/web\.business\.image.+ url reject
^https?:\/\/[^\/]*\.pstatp\.com\/obj\/mosaic-legacy\/.+\?from=ad url reject
^https?:\/\/[^\/]*\.pstatp\.com\/bytecom\/resource\/track_log\/.+ url reject
^https?:\/\/[^\/]*\.snssdk\.com\/video\/play\/1\/toutiao\/.+\/mp4 url reject
^https?:\/\/gurd\.snssdk\.com\/src\/server\/v\d+\/package url reject
^https?:\/\/adim\.pinduoduo\.com\/.+\/toutiao\?.+ url reject

# =========================
# 3. 运营弹窗配置（路径级）
# =========================
^https?:\/\/[^\/]*\.snssdk\.com\/motor\/operation\/activity\/display\/config\/.+ url reject-dict
