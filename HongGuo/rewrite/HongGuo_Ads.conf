# 红果短剧-去广告
# Quantumult X Rewrite（可直接作为远程重写资源 / 本地 rewrite_local）
# tag 建议：红果短剧-去广告 | update-interval=86400 | opt-parser=true | enabled=true
#
# 脚本：默认使用本仓库 raw 直链（远程订阅可直接生效）
# 本地调试可将下方脚本 URL 改为 HongGuo_Ads.js，并把文件放入 Quantumult X/Scripts

hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao-b.com, is.snssdk.com, *.pglstatp-toutiao.com, sf3-fe-tos.pglstatp-toutiao.com, sf3-be-pack.pglstatp-toutiao.com, gurd.snssdk.com, *-cdn-tos.bytescm.com, adim.pinduoduo.com, *.fqnovel.com, reading.snssdk.com, p6-ad-sign.byteimg.com, p9-ad-sign.byteimg.com

# =========================
# 1. 穿山甲 SDK / 广告 API（空包或拦截）
# =========================
^https?:\/\/[^\/]*pangolin-sdk-toutiao[^\/]*\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads.js
^https?:\/\/is\.snssdk\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/? url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads.js
^https?:\/\/[^\/]*\.?snssdk\.com\/api\/ad\/.+ url reject-dict
^https?:\/\/[^\/]*\.?snssdk\.com\/api\/adserver\/.+ url reject-dict

# =========================
# 2. 广告素材 / 渲染包 / 追踪
# =========================
^https?:\/\/[^\/]*pglstatp-toutiao\.com\/.+\/toutiao\.mp4 url reject
^https?:\/\/[^\/]*(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/[^\/]*(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/web\.business\.image\/.+ url reject
^https?:\/\/[^\/]*(pglstatp-toutiao|pstatp)\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/[^\/]*(pglstatp-toutiao|pstatp)\.com\/obj\/ad-site-adstyle-public\/.+ url reject
^https?:\/\/[^\/]*(pglstatp-toutiao|pstatp)\.com\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/sf3-fe-tos\.pglstatp-toutiao\.com\/obj\/ad-pattern\/.+ url reject
^https?:\/\/sf3-be-pack\.pglstatp-toutiao\.com\/obj\/ad-app-package\/.+ url reject
^https?:\/\/lf\d?-cdn-tos\.bytescm\.com\/obj\/static\/ad\/.+ url reject
^https?:\/\/gurd\.snssdk\.com\/src\/server\/v\d+\/package url reject
^https?:\/\/[^\/]*\.pstatp\.com\/obj\/mosaic-legacy\/.+\?from=ad url reject
^https?:\/\/[^\/]*\.pstatp\.com\/bytecom\/resource\/track_log\/.+ url reject
^https?:\/\/[^\/]*\.snssdk\.com\/video\/play\/1\/toutiao\/.+\/mp4 url reject
^https?:\/\/[^\/]*\.byteimg\.com\/ad-app-package.+ url reject
^https?:\/\/[^\/]*\.byteimg\.com\/web\.business\.image.+ url reject
^https?:\/\/p\d+-ad-sign\.byteimg\.com\/.+ url reject
^https?:\/\/adim\.pinduoduo\.com\/.+\/toutiao\?.+ url reject

# =========================
# 3. 开屏 / 运营弹窗 / 活动配置（字节通用）
# =========================
^https?:\/\/[^\/]*\.?snssdk\.com\/motor\/operation\/activity\/display\/config\/.+ url reject-dict
^https?:\/\/[^\/]*\.?snssdk\.com\/.+\/(splash|open_ad|openscreen|app_splash).+ url reject-dict

# =========================
# 4. 红果/番茄业务域名：仅对疑似广告/配置/解锁接口改包
#    注意：不 reject 播放 CDN；路径过宽易误伤时可只保留本节含 ad|splash|popup 的行
# =========================
^https?:\/\/[^\/]*\.fqnovel\.com\/.+?(ad|advert|splash|popup|banner|reward|incentive|unlock|commerce|promotion|operation|config|feed|mall|live).+ url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads.js
^https?:\/\/reading\.snssdk\.com\/.+?(ad|advert|splash|popup|banner|reward|incentive|unlock|commerce|promotion).+ url script-response-body https://raw.githubusercontent.com/zhouyinyuangit/Quantumult-X/main/HongGuo/scripts/HongGuo_Ads.js

# =========================
# 5. 直播带货 / 电商引流素材（可选，误伤时注释本段）
# =========================
^https?:\/\/[^\/]*webcast[^\/]*\.douyinpic\.com\/.+ url reject
^https?:\/\/[^\/]*webcast[^\/]*\.douyinstatic\.com\/.+ url reject
^https?:\/\/[^\/]*\.ecombdimg\.com\/.+ url reject
^https?:\/\/[^\/]*ad-sign[^\/]*\.byteimg\.com\/.+ url reject
